{% extends "base.html" %}

{% block title %}Password Reset Complete | Django Auth Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5 text-center">
      <div class="card card-auth p-4">
        <div class="card-body">
          <div class="mb-3">
            <span class="rounded-circle bg-success-subtle p-3 d-inline-flex text-success">
              <i class="bi bi-shield-check fs-2"></i>
            </span>
          </div>

          <h3 class="fw-bold mb-2">Password Successfully Reset</h3>
          <p class="text-muted mb-4">
            Your password has been changed. You may now sign in using your new credentials.
          </p>

          <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
